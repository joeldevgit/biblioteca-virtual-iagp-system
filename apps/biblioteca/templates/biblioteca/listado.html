{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            📚 Documentos jurídicos
        </h2>

        <!-- <p class="text-muted">
            Consulta normativa, jurisprudencia y doctrina.
        </p> -->

    </div>



    <!-- ===================================================== -->
    <!-- FILTROS AUTOMÁTICOS -->
    <!-- ===================================================== -->
    <form method="get" class="card shadow-sm mb-4" id="filtrosBiblioteca">

        <!-- ================================================= -->
        <!-- CONTEXTO FIJO -->
        <!-- ================================================= -->

        <input type="hidden" name="categoria" value="{{ categoria_seleccionada }}">

        <input type="hidden" name="institucion" value="{{ institucion_seleccionada }}">


        <div class="card-body">

            <div class="row g-3 align-items-end">


                <!-- ========================================= -->
                <!-- BUSCAR -->
                <!-- ========================================= -->
                <div class="col-lg-6">

                    <label class="form-label fw-semibold">
                        Buscar
                    </label>

                    <input type="text" name="buscar" id="buscar" class="form-control"
                        placeholder="Buscar por título, tema..." value="{{ buscar_seleccionado|default:'' }}"
                        autocomplete="off">

                </div>


                <!-- ========================================= -->
                <!-- TIPO -->
                <!-- ========================================= -->
                <div class="col-lg-3">

                    <label class="form-label fw-semibold">
                        Tipo
                    </label>

                    <select name="tipo" id="tipo" class="form-select">

                        <option value="">
                            Todos
                        </option>


                        {% for tipo in tipos %}

                        <option value="{{ tipo.id }}" {% if tipo.id == tipo_seleccionado %} selected {% endif %}>
                            {{ tipo.nombre }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- ========================================= -->
                <!-- AÑO -->
                <!-- ========================================= -->
                <div class="col-lg-3">

                    <label class="form-label fw-semibold">
                        Año
                    </label>

                    <select name="anio" id="anio" class="form-select">

                        <option value="">
                            Todos
                        </option>


                        {% for anio_item in anios %}

                        <option value="{{ anio_item }}" {% if anio_item == anio_seleccionado %} selected {% endif %}>
                            {{ anio_item }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- ========================================= -->
                <!-- LIMPIAR -->
                <!-- ========================================= -->
                <div class="col-12">

                    <a href="{% url 'biblioteca:listado' %}?categoria={{ categoria_seleccionada }}&institucion={{ institucion_seleccionada }}"
                        class="btn btn-outline-secondary">
                        Limpiar filtros
                    </a>

                </div>

            </div>

        </div>

    </form>



    <!-- ===================================================== -->
    <!-- RESULTADOS -->
    <!-- ===================================================== -->

    <div id="contenedorResultados">

    {% include "biblioteca/_resultados.html" %}

    </div>





</div>





<script>
document.addEventListener("DOMContentLoaded", function () {

    const formulario = document.getElementById("filtrosBiblioteca");
    const buscar = document.getElementById("buscar");
    const tipo = document.getElementById("tipo");
    const anio = document.getElementById("anio");

    let temporizador = null;


    // =====================================================
    // FUNCIÓN AJAX
    // =====================================================

    function cargarResultados(pagina = 1) {

        const parametros = new URLSearchParams(
            new FormData(formulario)
        );

        // Página solicitada
        parametros.set("page", pagina);


        fetch(
            "{% url 'biblioteca:listado' %}?" + parametros.toString(),
            {
                method: "GET",

                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            }
        )

        .then(response => {

            if (!response.ok) {
                throw new Error("Error al cargar resultados");
            }

            return response.text();

        })

        .then(html => {

            document.getElementById("contenedorResultados").innerHTML = html;

        })

        .catch(error => {

            console.error(
                "Error:",
                error
            );

        });

    }


    // =====================================================
    // BÚSQUEDA AUTOMÁTICA
    // =====================================================

    buscar.addEventListener("input", function () {

        clearTimeout(temporizador);

        temporizador = setTimeout(function () {

            cargarResultados(1);

        }, 300);

    });


    // =====================================================
    // PAGINACIÓN AJAX
    // =====================================================

    document.addEventListener("click", function (event) {

        const enlace = event.target.closest(".pagina-ajax");

        if (!enlace) {
            return;
        }

        event.preventDefault();

        const pagina = enlace.dataset.page;

        cargarResultados(pagina);

    });


    // =====================================================
    // FILTRO TIPO
    // =====================================================

    tipo.addEventListener("change", function () {

        cargarResultados(1);

    });


    // =====================================================
    // FILTRO AÑO
    // =====================================================

    anio.addEventListener("change", function () {

        cargarResultados(1);

    });

});
</script>

{% endblock %}
